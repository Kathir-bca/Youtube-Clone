<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Youtube Clone</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/media.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="left-section">
            <button class="icon-button menu-button" type="button" aria-label="Toggle navigation menu" aria-expanded="false">
                <img class="h-menu" src="icons/hamburger-menu.svg" alt="">
            </button>
            <a class="logo-link" href="./" aria-label="YouTube home">
                <span class="logo-desktop"><img class="y-logo" src="icons/youtube-logo.svg" alt="YouTube"></span>
                <span class="logo-mobile" aria-hidden="true"><img src="icons/youtube-logo.svg" alt=""></span>
            </a>
        </div>

        <div class="middle-section">
            <input class="search" type="search" placeholder="Search" aria-label="Search videos" autocomplete="off">

            <button class="y-search" type="button" aria-label="Search">
                <img class="search-logo" src="icons/search.svg" alt="">
            </button>

            <button class="y-voice" type="button" aria-label="Voice search">
                <img class="voice-icon" src="icons/voice-search-icon.svg" alt="">
            </button>
        </div>

        <div class="right-section">

            <button class="header-icon-button" type="button" aria-label="Create">
                <img class="y-upload" src="icons/upload.svg" alt="">
            </button>

            <button class="header-icon-button" type="button" aria-label="YouTube apps">
                <img class="y-app" src="icons/youtube-apps.svg" alt="">
            </button>

            <div class="y-notification-container">
                <button class="header-icon-button notification-button" type="button" aria-label="Notifications">
                    <img class="y-notification" src="icons/notifications.svg" alt="">
                </button>
                <span class="n-count" aria-label="3 unread notifications">3</span>
                <div class="notification-panel" aria-hidden="true">
                    <div class="notification-panel-header">Notifications <button class="mark-read" type="button">Mark all as read</button></div>
                    <div class="notification-item"><strong>New video</strong><span>Your subscriptions have new videos.</span></div>
                    <div class="notification-item"><strong>Welcome back</strong><span>Check out what is trending today.</span></div>
                    <div class="notification-item"><strong>Activity</strong><span>You have 3 new notifications.</span></div>
                </div>
            </div>

            <button class="profile-button" type="button" aria-label="Account">
                <img class="y-user" src="profile/images.png" alt="Account">
            </button>

        </div>

    </header>


    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Primary navigation">

        <a class="sidebar-link" href="./" data-section="Home">
            <img src="icons/home.svg" alt="">
            <div>Home</div>
        </a>

        <a class="sidebar-link" href="pages/unavailable.html?section=Explore" data-section="Explore">
            <img src="icons/explore.svg" alt="">
            <div>Explore</div>
        </a>

        <a class="sidebar-link" href="pages/unavailable.html?section=Subscriptions" data-section="Subscriptions">
            <img src="icons/subscriptions.svg" alt="">
            <div>Subscriptions</div>
        </a>

        <a class="sidebar-link" href="pages/unavailable.html?section=Originals" data-section="Originals">
            <img src="icons/originals.svg" alt="">
            <div>Originals</div>
        </a>

        <a class="sidebar-link" href="pages/unavailable.html?section=YouTube%20Music" data-section="YouTube Music">
            <img src="icons/youtube-music.svg" alt="">
            <div>YouTube Music</div>
        </a>

        <a class="sidebar-link" href="pages/unavailable.html?section=Library" data-section="Library">
            <img src="icons/library.svg" alt="">
            <div>Library</div>
        </a>

    </aside>


    <!-- Main Content -->
    <main>

        <!-- Videos will be generated by videos.js -->
        <div class="video-grid" aria-live="polite"></div>

    </main>


    <!-- JavaScript -->
    <script src="data/videos.js"></script>
    <script src="scripts/script.js"></script>
    
</body>

</html>
