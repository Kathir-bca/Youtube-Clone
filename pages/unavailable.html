<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/page.css">
</head>
<body>
    <main class="page-shell">
        <a class="page-logo" href="../" aria-label="Go to YouTube home">
            <img src="../icons/youtube-logo.svg" alt="YouTube">
        </a>
        <section class="unavailable-card" aria-labelledby="page-title">
            <div class="page-icon" aria-hidden="true">▶</div>
            <p class="eyebrow">YouTube Clone</p>
            <h1 id="page-title">This page didn't work yet</h1>
            <p id="page-message">We're still building this section. You can go back home and continue watching videos.</p>
            <a class="home-button" href="../index.html">Go Home</a>
        </section>
    </main>
    <script>
        const section = new URLSearchParams(location.search).get('section');
        if (section) {
            document.title = `YouTube Clone — ${section}`;
            document.querySelector('.eyebrow').textContent = section;
            document.querySelector('#page-message').textContent = `${section} isn't available in this clone yet. Go home to continue watching videos.`;
        }
    </script>
</body>
</html>
